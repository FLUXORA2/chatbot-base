<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Chatbot</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="app">


    <header class="header">

      <div class="brand">

        <div class="logo">
          💬
        </div>

        <div>

          <h1 id="bot-name">
            Chatbot
          </h1>

          <p id="company-name">
            Asistente virtual
          </p>

        </div>

      </div>


      <div class="secure">

        ● Gratis · Sin compromiso

      </div>

    </header>


    <div class="progress-container">

      <div
        id="progress"
        class="progress"
      ></div>

    </div>


    <main
      id="chat"
      class="chat"
    ></main>


    <footer class="footer">

      Tus datos se utilizan únicamente
      para gestionar tu solicitud.

    </footer>


  </div>


  <!-- CONFIGURACIÓN -->

  <script src="config.js"></script>


  <!-- MOTOR -->

  <script src="script.js"></script>


  <script>

    document.getElementById(
      "bot-name"
    ).textContent =
      CONFIG.botName;


    document.getElementById(
      "company-name"
    ).textContent =
      CONFIG.companyName;

  </script>


</body>

</html>
